<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>印花稅-缴费</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 100px 0 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        [contenteditable="true"]:hover {
            background-color: #f0fdf4;
            outline: 1px dashed #005a36;
        }
        [contenteditable="true"]:focus {
            background-color: #fff;
            outline: 2px solid #005a36;
        }

        /* 统一控制面板样式 */
        .control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            max-width: 95vw;
            background: rgba(255, 255, 255, 0.98);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 10px 16px;
            z-index: 9999;
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%); }
            20%, 60% { transform: translateX(-52%); }
            40%, 80% { transform: translateX(-48%); }
        }
        .control-panel.shake {
            animation: shake 0.4s ease-in-out;
            border-color: #dc2626;
            background: rgba(254, 242, 242, 0.98);
        }

        .form-group {
            flex: 0 0 auto;
            width: 140px;
        }

        .form-group input {
            width: 100%;
            height: 36px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 13px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #005a36;
            box-shadow: 0 0 0 2px rgba(0, 90, 54, 0.2);
        }

        .action-btn {
            height: 36px;
            padding: 0 20px;
            background-color: #005a36;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 90, 54, 0.25);
            flex-shrink: 0;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .action-btn:hover {
            background-color: #004026;
            transform: translateY(-1px);
        }
        .action-btn:active {
            transform: translateY(0);
        }
        .action-btn.copied {
            background-color: #16a34a !important;
        }
        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .payment-container {
            width: 210mm;
            min-width: 210mm;
            max-width: 210mm;
            min-height: 297mm;
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 16mm 20mm 15mm 20mm;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin: 0 auto;
            box-sizing: border-box;
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #005a36;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .payment-header .title {
            font-size: 16pt;
            font-weight: bold;
            color: #005a36;
        }

        .info-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 10pt;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #6b7280;
        }
        .info-value {
            font-weight: 600;
            color: #111827;
        }

        .custom-toast {
            position: fixed;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc2626;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            z-index: 999999;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            pointer-events: none;
        }
        .custom-toast.show { top: 80px; }
        .custom-toast.success { background: #005a36; }
        .custom-toast.error { background: #dc2626; }
    </style>
</head>
<body>

<div class="control-panel" id="action-control-panel">
    <div class="form-group">
        <input type="text" id="input-name-zh" value="" placeholder="中文名">
    </div>

    <div class="form-group">
        <input type="text" id="input-name-en" value="" placeholder="英文名">
    </div>

    <div class="form-group">
        <input type="number" id="input-amount-cny" value="" step="0.01" placeholder="金额">
    </div>

    <button class="action-btn" id="btn-copy" onclick="copyPaymentAsImage()">复制图片</button>
</div>

<div class="payment-container" id="payment-capture-area">
    <div class="payment-header">
        <div class="title">印花稅繳費通知單</div>
        <div style="font-size: 9pt; color: #666;">STAMP DUTY PAYMENT NOTICE</div>
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="info-label">納稅人姓名 / Name:</span>
            <span class="info-value" id="display-taxpayer-name">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">應繳金額 / Payable Amount:</span>
            <span class="info-value" id="display-paid-amount" style="color: #d97706;">HK$ 0.00 (折合RMB 0.00)</span>
        </div>
        <div class="info-row">
            <span class="info-label">繳費截止日期 / Due Date:</span>
            <span class="info-value" id="display-due-date" contenteditable="true"></span>
        </div>
    </div>
</div>

<div id="customToast" class="custom-toast"></div>

<script>
    const EXCHANGE_RATE_HKD_TO_CNY = 0.92;

    function calculateAndSync() {
        const rawZhName = document.getElementById('input-name-zh').value.trim();
        const rawEnName = document.getElementById('input-name-en').value.trim();
        const cnyInputVal = document.getElementById('input-amount-cny').value.trim();

        let nameStr = "";
        if (rawEnName && rawZhName) {
            nameStr = `${rawEnName.toUpperCase()} (${rawZhName})`;
        } else if (rawEnName) {
            nameStr = rawEnName.toUpperCase();
        } else if (rawZhName) {
            nameStr = rawZhName;
        }
        document.getElementById('display-taxpayer-name').innerText = nameStr || "-";

        if (cnyInputVal !== "") {
            const cnyAmount = parseFloat(cnyInputVal) || 0;
            const hkdAmount = cnyAmount / EXCHANGE_RATE_HKD_TO_CNY;
            
            const hkdFormatted = hkdAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const cnyFormatted = cnyAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            
            document.getElementById('display-paid-amount').innerText = `HK$ ${hkdFormatted} (折合RMB ${cnyFormatted})`;
        } else {
            document.getElementById('display-paid-amount').innerText = `HK$ 0.00 (折合RMB 0.00)`;
        }
    }

    function triggerWarning(msg) {
        const panel = document.getElementById('action-control-panel');
        panel.classList.remove('shake');
        void panel.offsetWidth; 
        panel.classList.add('shake');
        showToast(msg, 'error');
    }

    function copyPaymentAsImage() {
        const zhName = document.getElementById('input-name-zh').value.trim();
        const enName = document.getElementById('input-name-en').value.trim();
        const amountCny = document.getElementById('input-amount-cny').value.trim();

        if (!zhName || !enName || !amountCny) {
            triggerWarning("请完整填写（姓名与人民币金额）后再生成！");
            return;
        }

        const targetElement = document.getElementById('payment-capture-area');
        const copyBtn = document.getElementById('btn-copy');
        
        copyBtn.disabled = true;
        copyBtn.innerText = "生成中...";

        html2canvas(targetElement, {
            scale: 3, 
            dpi: 300,
            useCORS: true,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            canvas.toBlob(blob => {
                if (navigator.clipboard && navigator.clipboard.write) {
                    const item = new ClipboardItem({ "image/png": blob });
                    navigator.clipboard.write([item]).then(() => {
                        copyBtn.classList.add('copied');
                        copyBtn.innerText = "已复制至剪贴板";
                        showToast("已复制至剪贴板", "success");
                        
                        setTimeout(() => {
                            copyBtn.classList.remove('copied');
                            copyBtn.innerText = "复制图片";
                            copyBtn.disabled = false;
                        }, 3000);
                        
                    }).catch(err => {
                        console.error("写入剪贴板失败: ", err);
                        showToast("剪贴板写入失败，请重试", "error");
                        copyBtn.innerText = "复制图片";
                        copyBtn.disabled = false;
                    });
                } else {
                    showToast("您的浏览器不支持剪贴板图片写入", "error");
                    copyBtn.innerText = "复制图片";
                    copyBtn.disabled = false;
                }
            }, "image/png");
        }).catch(err => {
            console.error("Canvas生成失败: ", err);
            showToast("生成图片失败，请重试", "error");
            copyBtn.innerText = "复制图片";
            copyBtn.disabled = false;
        });
    }

    function showToast(msg, type = 'error') {
        const toast = document.getElementById('customToast');
        toast.innerText = msg;
        toast.className = 'custom-toast';
        toast.classList.add(type);
        toast.classList.add('show');
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    window.onload = function() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('display-due-date').innerText = `${d}/${m}/${y}`;

        calculateAndSync();

        const inputs = document.querySelectorAll('.control-panel input');
        inputs.forEach(element => {
            ['input', 'change', 'keyup', 'paste'].forEach(eventName => {
                element.addEventListener(eventName, calculateAndSync);
            });
        });
    };
</script>

</body>
</html>
